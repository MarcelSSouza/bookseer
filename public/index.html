<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6c4cf5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BookSeer" />
<meta name="description" content="Peça ebooks e audiobooks, eles chegam prontos na sua biblioteca." />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-192.png" />
<title>BookSeer</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="toasts" class="toasts"></div>

  <header>
    <div class="brand"><span class="brand-emoji">📚</span><span>BookSeer</span></div>
  </header>

  <main id="search-view">
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Buscar livro ou autor..." />
      <button id="search-btn" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21.71 20.29l-5.4-5.39A8 8 0 1 0 14 16a8 8 0 0 0 4.9-1.69l5.39 5.4ZM4 10a6 6 0 1 1 6 6 6 6 0 0 1-6-6Z"/></svg>
      </button>
    </div>
    <div class="filter-row">
      <div class="chip-group" id="type-chips">
        <button class="chip active" data-type="title">Título</button>
        <button class="chip" data-type="author">Autor</button>
      </div>
      <select id="search-lang" class="lang-select">
        <option value="">🌐 Qualquer idioma</option>
        <option value="por">🇧🇷 Português</option>
        <option value="eng">🇬🇧 Inglês</option>
        <option value="spa">🇪🇸 Espanhol</option>
        <option value="fre">🇫🇷 Francês</option>
        <option value="ger">🇩🇪 Alemão</option>
        <option value="ita">🇮🇹 Italiano</option>
      </select>
    </div>
    <div id="results" class="grid"></div>
  </main>

  <main id="requests-view" class="hidden">
    <div id="requests-list"></div>
  </main>

  <nav class="bottom-nav">
    <button class="navbtn active" data-tab="search">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M21.71 20.29l-5.4-5.39A8 8 0 1 0 14 16a8 8 0 0 0 4.9-1.69l5.39 5.4ZM4 10a6 6 0 1 1 6 6 6 6 0 0 1-6-6Z"/></svg>
      <span>Pesquisar</span>
    </button>
    <button class="navbtn" data-tab="requests">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 10.59V7h-2v6.41l4.29 4.3 1.42-1.42Z"/></svg>
      <span>Meus Pedidos</span>
      <span id="nav-badge" class="badge hidden">0</span>
    </button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" aria-label="Fechar">×</button>
      <div class="modal-body">
        <div class="modal-cover" id="modal-cover"></div>
        <h2 id="modal-title"></h2>
        <p id="modal-author" class="author"></p>
        <div class="kind-toggle">
          <label class="kind-pill"><input type="radio" name="kind" value="ebook" checked /><span>📖 Ebook</span></label>
          <label class="kind-pill"><input type="radio" name="kind" value="audiobook" /><span>🎧 Audiobook</span></label>
        </div>
        <select id="format-filter" class="lang-select" style="width:100%; margin-bottom:0.8rem;">
          <option value="">📄 Qualquer formato</option>
          <option value="epub">EPUB</option>
          <option value="pdf">PDF</option>
          <option value="mobi">MOBI</option>
          <option value="azw3">AZW3</option>
          <option value="txt">TXT</option>
          <option value="odt">ODT</option>
          <option value="fb2">FB2</option>
          <option value="cbz">CBZ</option>
          <option value="cbr">CBR</option>
          <option value="doc">DOC/DOCX</option>
          <option value="rtf">RTF</option>
        </select>
        <button id="modal-search-releases" class="primary-btn">Buscar versões disponíveis</button>
        <div id="releases"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
